[task]
name = "edgebench/treasury_liquidity_provisioning_book"
description = "US Treasury short-end cash allocation book — daily-cadence 6-bin cross-sectional cash mix across the Treasury bill maturity spread (4W/8W/13W/26W bills + O/N RRP + IORB proxy) with SOFR/RRP/TGA funding-condition overlays. Agent produces per-day 6-bin cash mix + 4-class funding label + extreme-stress flag + weekly issuance direction + composite book across a hidden 2025-01-01 to 2026-07-31 daily window (~395 rebalance dates). Scored on 8 lanes + funding-cycle bonus, 0-110."
keywords = [
  "professional-knowledge-work",
  "finance",
  "treasury-bill-liquidity",
  "short-end-cash-allocation",
  "funding-condition-adaptive",
]

[[task.authors]]
name = "Mephisto"

