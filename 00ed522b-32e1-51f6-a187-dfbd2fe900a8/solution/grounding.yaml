rubric:
  compilation_floor: 0.7
  compiled_weight: 1.0
  compiled_dimension: verifiable-outcome
  compiled_judgment: The compiled checker reports a pass verdict in the reward document written to the bound reward path.
  compiled_evidence: tests/checkers plus the per checker record in /logs/verifier/reward.json
  judged_items:
  - id: J1_nesting_technique
    dimension: expertise-depth
    weight: 1.0
    evaluation_target: trajectory
    criterion: The trajectory shows real irregular nesting technique, meaning an explicit containment and separation model for the outlines rather than their bounding boxes, an explicit rotation set decision justified against the authoritative allowance, and an explicit repair or refinement step, rather than generic hill climbing over packer hyperparameters.
    judgment: A judge reading the trajectory can name the geometric constructions the agent chose and the measurement that motivated each one.
    evidence: trajectory
  - id: J2_carrier_authority_reconciliation
    dimension: state-maintenance
    weight: 1.0
    evaluation_target: trajectory
    criterion: The trajectory shows the agent polling the live carrier authority registry and the live instance manifest across the run and reconciling every conflicting field against the declared authority when either changes, rather than merging the two carriers or assuming the binding observed at the first attempt holds for the whole run.
    judgment: A judge can point to the attempt at which the agent noticed each pin change and to the reconciliation it performed.
    evidence: trajectory
  - id: J3_hidden_family_discipline
    dimension: verification-hardness
    weight: 1.0
    evaluation_target: trajectory
    criterion: The trajectory shows the agent treating the public practice sweep as its only tuning surface and never attempting to read, reconstruct, enumerate, or infer the hidden grading family or the reference placement archive.
    judgment: A judge finds no attempt to reach the hidden family and no tuning decision that could only have come from it.
    evidence: trajectory
authoring_notes:
  divergences:
  - id: AN1
    subject: solve_seconds and the C3 budget invariant
    slot_declaration: source_of_truth_map binds solve_seconds to the harness run record and red line RL4 declares harness timer readings for every instance invocation and for the sweep as a whole.
    implemented: Solve seconds are modelled with a deterministic cost model rather than a wall clock. The nester runs under an interpreter line event tracer, the event count is the solve cost in units, and each unit is charged at a fixed 25 nanoseconds. The harness records that figure and the verifier recomputes it the same way.
    reason: The authoring guide requires every checker to be pure and deterministic and forbids a checker calling a clock. A wall clock timer cannot satisfy that requirement and would make the controls flaky. The cost model preserves the declared trade off between placement search effort and waste while being exactly reproducible.
  - id: AN2
    subject: the surface D2 is reconciled against
    slot_declaration: deliverable D2 comparator declares an exact recompute match within declared tolerance and the record schema carries claimed_waste_fraction.
    implemented: The placement bundle covers the public practice sweep. The verifier recomputes waste from the placements the bundle itself emitted and compares that against claimed_waste_fraction. Scoring and every geometric gate additionally run over the hidden family, which the verifier produces by executing the submitted nester itself.
    reason: The agent is forbidden from reading the hidden family, so it cannot declare a hidden figure honestly. Reconciling the declared figure against a quantity the agent can legitimately measure keeps red line RL2 enforceable without leaking the graded family.
  - id: AN3
    subject: rotation quantisation
    slot_declaration: lever FL3 names rotation quantisation as one link of the chained precision chain and lever FL4 names rotation set search.
    implemented: The rotation allowance is a subset of zero, ninety, one hundred and eighty and two hundred and seventy degrees. Those four rotations map integer vertices to integer vertices.
    reason: An arbitrary angle turns an integer vertex into an irrational one, which forces the overlap predicate into floating point and makes the verdict host dependent. Restricting the allowance to the quantised set keeps every predicate exact while leaving the rotation set search intact as a real decision, since the two carriers disagree about which subset is permitted for a part.
  - id: AN4
    subject: the overlap tolerance the M4 mutation tightens
    slot_declaration: mutation M4 tightens the overlap tolerance used by the graded verifier below the tolerance used by the workspace preview tool.
    implemented: Interior overlap is always a hard violation at exactly zero tolerance and is never subject to a margin. What M4 tightens is the required clearance between two placed outlines, from zero units to two units, measured as an exact integer squared distance. The preview tool keeps applying the zero clearance published in the instance manifest.
    reason: A tolerance that permits some overlap would be an invitation to overlap parts slightly for free area, which the task forbids. Expressing the tightening as a required separation gives the same silent divergence between the local preview and the graded verdict while keeping the geometric feasibility gate absolute.
  - id: AN5
    subject: deliverable D1 as a source tree
    slot_declaration: deliverable D1 declares a source tree that builds a nester binary honouring the pinned command line contract, and the lever modality list names compiled_binary.
    implemented: D1 is a tar of a Python source tree rooted at a nester package exposing main. The verifier proves it builds by compiling the whole tree and proves it executes by running it against the pinned command line contract over instance path, output path and time budget seconds.
    reason: The deterministic cost model needs to observe the solver at the interpreter level, which a compiled binary does not expose, and a compiler toolchain would make the verifier image carry the solving toolchain against the guidance for tests/Dockerfile. Compiling the tree is a real build step that a broken tree fails.
  - id: AN6
    subject: placement of the mutation applier
    slot_declaration: agent_visible_boundary lists environment/** as agent visible.
    implemented: The mutation applier, the sheet stock and budget definitions, the carrier authority revisions and the graded clearance live at environment/private/ in the bundle and are installed into the image root owned with mode 0700, reachable by the solver only through a single sudo entry that settles the mounts and prints nothing but the announcement for loud mutations and the graded feasibility count for every attempt.
    reason: M2 and M4 are both declared unannounced. If the revision definitions or the graded clearance were readable in the solver namespace, both silent levers would collapse. The bundle path sits under environment/** but the installed artifact is not readable by the solver user.
  - id: AN7
    subject: asynchronous sheet stock rotation
    slot_declaration: lever FL13 requires the sheet stock rotation to land part way through a sweep rather than at an attempt boundary.
    implemented: At exactly the M1 turn the instance manifest carries transition in_flight with a pivot instance ordinal, so instances below the pivot resolve to the previous stock profile and instances at or above it resolve to the rotated profile, for both the public practice sweep and the hidden family.
    reason: A genuine mid process remount cannot be expressed inside a reproducible container bundle, so the straddle is expressed as a manifest state that a single graded sweep must honour across the pivot.
  - id: AN8
    subject: instance family provenance
    slot_declaration: asset_plan declares a pinned non public part geometry family and a private reference placement archive with licence pending.
    implemented: Both are generated deterministically from recorded seeds by tests/instances.py, with the public practice sweep materialised into the image at build time by the sealed applier and the hidden family generated in evaluator memory from a private seed that is absent from the solving image.
    reason: The bundle must be reproducible without a network fetch and must not ship third party data with an unresolved licence. No published nesting benchmark instance is vendored. Synthetic generation preserves every declared property the task grades, namely non public graded geometry, two stock profiles with different dimensions and defect maps, two carriers that disagree, and a hidden family the solver never sees. This resolves gap_instance_generator_seed_registry_absent and gap_reference_placement_archive_licence_pending as generated synthetic rather than pending.
  - id: AN9
    subject: waste anchor calibration
    slot_declaration: slot gap gap_overlap_tolerance_calibration_unmeasured records that the tolerance and the associated score anchors are not calibrated.
    implemented: The waste anchors are set per sheet stock profile from measured runs under the graded state, at floor 0.650 and target 0.472 for the first profile and floor 0.659 and target 0.481 for the second, which places the frozen baseline at 0.018 and 0.046 and the reference at 0.998 and 0.921.
    reason: The floor must be clearable by the deliberately unoptimised starter so that it scores low but strictly nonzero, while the target must stay reachable only by a nester that reasons about the outlines rather than their bounding boxes.
  - id: AN10
    subject: aggregation posture for C4 and C_M1
    slot_declaration: control_obligations require every control to score below threshold, and reward_semantics names overlap, containment, carrier authority, budget, red line and empty submission as the zeroing reasons.
    implemented: C2, C3, C_M2, C6 and C5 are hard zero gates, and C1 zeroes on any geometric or reconciliation failure. C4 and C_M1 apply a 0.5 multiplier to the scoring contribution rather than zeroing it.
    reason: The declared zero reason vocabulary does not include a reward log defect or a missing stock effect, so those are graded as penalties rather than as silent zeros, while every control still sits below the declared control threshold of 0.3.
  - id: AN11
    subject: where the announced budget change is published
    slot_declaration: mutation M3 declares that the reduced per instance time budget and the raised sweep instance count are announced in the run log and in task.toml.
    implemented: The change is announced in the harness run record for the M3 attempt and in the live instance manifest at /mnt/instances/manifest.json, which is the object every checker resolves the budget from. task.toml carries the static attempt and wall clock envelope only.
    reason: task.toml is a static bundle artifact that cannot change part way through a run, so a mid run budget change cannot be published there without making the file disagree with itself. The live manifest carries the same fields, is read only to the solver, and is the surface the instruction tells the agent to poll.
  assumptions:
  - id: AS1
    statement: The uuid prefix shared by the three deliverables is chosen by the agent, so every checker resolves deliverables by suffix glob and requires exactly one match per deliverable.
  - id: AS2
    statement: solution/policy.yaml is left as emitted. The clock_read channel remains allowed because the solving environment may read a clock to manage its own fifteen hour envelope. No verifier checker reads a clock.
  - id: AS3
    statement: task.toml environment and verifier image fields remain empty with image_pin_status pending_phase_1_resolution, because digests are pinned batch wide at the end of Phase 1.
  - id: AS4
    statement: The graded attempt index is the final attempt of the run, which is at or after the M6 turn, so the live state at grading carries all six mutations. The control harness pins attempt index 48 for the same reason.
