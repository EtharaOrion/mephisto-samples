  turn: 11
  operation: The sheet stock is rotated to a second pinned profile with different sheet dimensions and a denser defect exclusion map, announced in the run log and in the instance manifest.
  bound_checker: C_M1_sheet_stock_identity
  bound_stale_control: null
  from_profile: stock-a-2026-08-17
  to_profile: stock-b-2026-08-17
  pivot_instance: 2
  straddle_turn: 11
- mutation_id: M2
  loud: false
  turn: 27
  operation: The carrier authority registry is silently repinned so that the rotation allowance and part multiplicity fields resolve against the vector outline carrier rather than the parameter table carrier, changing which conflicting value binds without any announcement in the run log.
  bound_checker: C_M2_geometry_authority_binding
  bound_stale_control: CTL_stale_geometry_authority
  from_revision: ca-2026-08-17.a
  to_revision: ca-2026-08-17.b
- mutation_id: M3
  loud: true
  turn: 39
  operation: The per instance time budget is reduced and the sweep instance count is raised, announced in the run log and in task.toml.
  bound_checker: C3_budget_invariant
  bound_stale_control: null
  from_per_instance_budget_seconds: 1.2
  to_per_instance_budget_seconds: 0.6
  from_public_instance_count: 4
  to_public_instance_count: 6
  from_hidden_instance_count: 6
  to_hidden_instance_count: 9
- mutation_id: M4
  loud: false
  turn: 33
  operation: The overlap tolerance used by the graded verifier is silently tightened below the tolerance used by the workspace preview tool, so placements that the local preview accepts are rejected by the verifier with no visible error at solve time.
  bound_checker: C6_silent_overlap_divergence
  bound_stale_control: CTL_stale_geometry_authority
  from_graded_clearance_units: 0
  to_graded_clearance_units: 2
  preview_clearance_units: 0
- mutation_id: M5
  loud: false
  turn: 18
  operation: The usable sheet region predicate is silently repinned from raw_sheet_rectangle to trim_inset_rectangle with a pinned trim inset of three sheet units on all four edges, so the graded containment rectangle becomes the corner pair inset by three units, every previously valid layout that seats a part vertex within three units of a raw sheet edge turns infeasible, the usable area denominator every waste figure was computed against changes, and each emitted row must declare a usable_region_digest equal to the sha256 over the canonical json of the mode, the inset, the profile identifier, the inset corner pair and the defect list, with no announcement in the run log, in task.toml or in the instance manifest.
  bound_checker: C_M5_usable_region_binding
  bound_stale_control: CTL_stale_usable_region
  from_region_mode: raw_sheet_rectangle
  to_region_mode: trim_inset_rectangle
  trim_inset_units: 3
- mutation_id: M6
  loud: false
  turn: 46
  operation: The part outline fidelity revision is silently repinned from outline-2026-08-17.a on the unit lattice to outline-2026-08-17.b on the quarter unit lattice, so every outline is restated at four times scale and each piece whose ordinal is congruent to one modulo three grows by one quarter unit outward at every vertex, which makes every cached no fit polygon, every cached pairwise collision result and every tightly packed layout that relied on parts touching at the coarse lattice stale, and each emitted row must declare an outline_revision_id and an outline_geometry_digest equal to the sha256 over the canonical json of the revision, the scale and the piece identifier ordered refined vertex lists, with no announcement anywhere the agent can read.
  bound_checker: C_M6_outline_fidelity_binding
