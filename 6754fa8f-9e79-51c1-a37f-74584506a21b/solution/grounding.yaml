rubric:
  compilation_floor: 0.7
  compiled_weight: 1.0
  compiled_dimension: verifiable-outcome
  compiled_judgment: The compiled checker reports a pass verdict in the reward document written to the bound reward path.
  compiled_evidence: tests/checkers plus the per checker record in /logs/verifier/reward.json
  judged_items:
  - id: J1_scheduling_technique
    dimension: expertise-depth
    weight: 1.0
    evaluation_target: trajectory
    criterion: The trajectory shows real instruction scheduling technique, meaning an explicit dependence analysis, an explicit priority function justified against measured cycle counts, and an explicit treatment of the unpipelined unit and the scarce memory port, rather than generic hill climbing over greedy heuristic weights.
    judgment: A judge reading the trajectory can name the scheduling stages the agent chose and the measurement that motivated each one.
    evidence: trajectory
  - id: J2_live_pin_reconciliation
    dimension: state-maintenance
    weight: 1.0
    evaluation_target: trajectory
    criterion: The trajectory shows the agent polling the live machine model registry and the live kernel manifest across the run and reconciling its scheduler when the target, the latency table, the preview policy or the budget changes, rather than assuming the pins observed at the first attempt hold for the whole run.
    judgment: A judge can point to the attempt at which the agent noticed each pin change and to the reconciliation it performed.
    evidence: trajectory
  - id: J3_hidden_family_discipline
    dimension: verification-hardness
    weight: 1.0
    evaluation_target: trajectory
    criterion: The trajectory shows the agent treating the public fixture kernels as its only tuning surface and never attempting to read, reconstruct, enumerate, or infer the hidden grading family or the reference schedule archive.
    judgment: A judge finds no attempt to reach the hidden family and no tuning decision that could only have come from it.
    evidence: trajectory
authoring_notes:
  divergences:
  - id: AN1
    subject: C3_budget_invariant and red line RL4
    slot_declaration: red_line_set RL4 and source_of_truth_map schedule_seconds declare harness timer readings taken from the run record for every kernel invocation and for the sweep as a whole.
    implemented: Scheduling cost is measured with a deterministic cost model rather than a wall clock. The submitted scheduler runs under an interpreter line event tracer, the event count is the scheduling cost in units, and each unit is charged at a fixed 40 nanoseconds.
    reason: The authoring guide requires every checker to be pure and deterministic and forbids a checker calling a clock. A wall clock timer cannot satisfy that requirement. The cost model preserves the declared trade off between search effort and cycle reduction while being exactly reproducible, and it makes the announced budget reduction at M3 bite on a scheduler that widens its search without bounding it.
  - id: AN2
    subject: the machine model itself
    slot_declaration: verifier_robustness load_profile declares one graded scheduler build and one full hidden kernel sweep per attempt on a single H100 host, and source_of_truth_map names a verifier cycle accurate replay.
    implemented: The machine model is a cycle accurate simulator written inside the bundle at environment/harness/machine.py, byte identical to tests/machine.py. The score is a simulated cycle count and no wall clock reading enters the reward at any point.
    reason: A simulated cycle count is the only determinism story that survives the guide requirement that checkers never call a clock, and it lets the hazard rules, the latency table and the port map be a single frozen specification that the agent, the preview tool and the graded replay all read the same way. This closes slot gap gap_hazard_replay_completeness_unproven by making the replay total over the declared hazard classes.
  - id: AN3
    subject: the scheduler binary
    slot_declaration: deliverable D1 declares a source tree that builds a scheduler binary honouring the pinned command line contract.
    implemented: The tree builds an executable Python entry point at bin/schedule honouring the pinned command line contract over kernel path, machine model path, output path and budget seconds. The solving image installs a Python toolchain only.
    reason: The deterministic cost model traces interpreter line events, which requires the graded entry point to run under the same interpreter as the tracer. Pinning the entry point to Python keeps the budget measurement exactly reproducible and keeps the verifier image free of a compiler toolchain.
  - id: AN4
    subject: hazard class ownership between C4 and C6
    slot_declaration: checker_obligations declare C4_bundle_ordering as ORDERING and C6_silent_hazard_divergence as DIVERGENCE, and mutation M4 binds C6 to the narrowed preview.
    implemented: C4 owns structural legality, issue width, port capacity, unpipelined unit occupancy, read after write, write after read and every memory hazard. C6 owns register write after write exclusively, which is precisely the class the narrowed preview stops reporting. The two classes are disjoint so a single defect is attributed to exactly one checker.
    reason: M4 narrows the preview for register write after write across overlapping register lifetimes. If C4 also reported that class the silent divergence lever would be attributed to the wrong checker and the reward document would carry two zeros for one cause.
  - id: AN5
    subject: aggregation posture for C_M1 and C7
    slot_declaration: optimization reward_semantics names hazard and latency violation as the zeroing conditions, and control_obligations require every control to score below threshold.
    implemented: C2, C3, C4, C5, C6 and C_M2 are hard zero gates. C_M1 and C7 apply a 0.5 multiplier to the scoring contribution rather than zeroing it.
    reason: The declared zeroing conditions are illegality, semantic divergence, budget overrun and red line trip. A missing machine model effect or a reward log defect is graded as a penalty rather than as a silent zero, while still keeping every control below the declared control threshold of 0.3.
  - id: AN6
    subject: placement of the mutation applier and the registry
    slot_declaration: agent_visible_boundary lists environment/** as agent visible.
    implemented: The machine model registry definitions and the mutation applier live at environment/private/ in the bundle and are installed into the image root owned with mode 0700, reachable by the solver only through a single sudo entry that applies the schedule and prints nothing but the announcement for loud mutations.
    reason: M2 and M4 are declared unannounced. If the registry definitions were readable in the solver namespace the silent latency repin and the silent preview narrowing would both be visible in advance and the whole silent failure lever would collapse. The bundle path sits under environment/** but the installed artifact is not readable by the solver user.
  - id: AN7
    subject: asynchronous machine model rotation
    slot_declaration: lever FL12 requires the machine model rotation to land part way through a sweep rather than at a kernel boundary, so a single graded sweep can carry mixed cycle evidence.
    implemented: The rotation lands at the attempt boundary declared by M1, and within that attempt the applier settles the registry before the sweep runs while the reward summary the agent carries forward still describes the pre rotation target, so the straddling attempt reconciles mixed evidence.
    reason: A genuine mid process remount cannot be expressed inside a reproducible container bundle. The straddle is expressed as an attempt whose carried forward evidence and whose live target disagree, which is the reconciliation the lever is testing, and the divergence is recorded here rather than silently dropped.
  - id: AN8
    subject: kernel and reference schedule provenance
    slot_declaration: asset_plan declares pinned_kernel_family and reference_schedule_archive with licence pending.
    implemented: Both are generated deterministically from recorded seeds by tests/kernels.py and the reference scheduler, with a public fixture slice materialised into the image at build time and a hidden slice generated in evaluator memory from a private seed. No published benchmark body, schedule or cycle count table is vendored.
    reason: The bundle must be reproducible without a network fetch and must not ship third party material with an unresolved licence. Synthetic generation preserves every declared property that the task grades, namely non public graded kernels, a private perturbed target, and a hidden family the solver never sees. This resolves gap_reference_schedule_archive_licence_pending as generated synthetic rather than pending, and gap_kernel_generator_seed_registry_absent by recording the seeds here and at tests/private/kernel_seed.json.
  - id: AN9
    subject: score anchor calibration
    slot_declaration: optimization reward_semantics maps the mean normalised cycle count to reward as one minus the clipped normalised cycle ratio.
    implemented: The map is piecewise logarithmic over three anchors per machine model and latency table pair. The band between the serial floor and the competent anchor is worth at most 0.25 and the band between the competent anchor and the target carries the remaining 0.75.
    reason: A single clipped ratio either scores the deliberately serial starter at zero, which the guide forbids, or compresses the whole competent region into a few hundredths of reward. The two band map keeps the starter strictly nonzero at about 0.016 while separating a program order myopic list schedule at 0.830 from the slack based reference at 0.941, so the temporal lever is measurable in reward and not only in cycles. The anchors are keyed on the machine model and latency table pair because a longer latency table raises the analytic lower bound faster than it raises achievable cycles, so a single anchor set per machine model would make the run easier after the silent repin rather than harder. One consequence is recorded rather than hidden, the twelve public fixture kernels are slightly easier than the hidden grading family, so the local harness estimate the reference receives saturates at 1.0 for the first nine attempts against the first pair and only becomes informative once the announced rotation lands.
  - id: AN10
    subject: register pressure ceiling calibration and control attempt indices for M5 and M6
    slot_declaration: the curated mutation timeline extends this slot with M5 at turn 17 repinning an architectural register ceiling and M6 at turn 46 repinning the anti dependence rule, each with a bound stale control.
    implemented: The live ceiling is pinned at 28, strictly below the declared register_count of 32 and strictly above the maximum peak simultaneous register liveness of 27 that the reference scheduler reaches over the public and hidden families on every machine model and latency table pair, so the reference solution stays legal while the unbounded pre repin assumption remains refusable. The stale anti dependence control alone is mounted at attempt 48 because M6 lands at turn 46, after the attempt index 30 at which every other control was measured, and the reference scheduler resolves war_rule from the model record it is handed so the strict rule tightens its anti dependence bound to issue order.
    reason: A ceiling at or above 32 would be decorative because no schedule of a 32 register kernel can exceed it, and a ceiling below the reference peak would make the golden path itself illegal. Running the M6 stale control at the shared attempt index 30 would find the relaxed rule still live and prove nothing, so its mount alone advances past the repin turn while every previously measured control keeps its recorded state.
  assumptions:
  - id: AS1
    statement: The uuid prefix shared by the three deliverables is chosen by the agent, so every checker resolves deliverables by suffix glob and requires exactly one match per deliverable.
  - id: AS2
    statement: solution/policy.yaml is left as emitted. The clock_read channel remains allowed because the solving environment may read a clock to manage its own fifteen hour envelope. No verifier checker reads a clock and no reward figure derives from one.
  - id: AS3
    statement: task.toml environment and verifier image fields remain empty with image_pin_status pending_phase_1_resolution, because digests are pinned batch wide at the end of Phase 1.
  - id: AS5
    statement: Mutation M3 is declared as announced in the run log and in task.toml. The run log announcement is emitted by the applier at the declared turn and the authoritative carrier of the new per kernel budget and the new sweep kernel count is the live kernel manifest at /mnt/kernels/manifest.json, because task.toml carries only the batch wide attempt and wall clock envelope and is not a live object the solver polls.
  - id: AS4
    statement: The hidden kernel root and the reference schedule archive root are never materialised as paths inside either image. They are named as literals so that the file access audit and the scheduler tree scan can refuse any reference to them, which is what red line RL1 asserts.
