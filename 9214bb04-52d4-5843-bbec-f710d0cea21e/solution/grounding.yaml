mephisto_extensions:
  framework: "A"
  task_shape: "structured-classification-strong-signal"
  honest_reference_ceiling_estimate: 32
  reference_self_score_target_band: [24, 44]
  reference_self_score_measured: 27.942
  expert_effort_hours_estimate: 60
  expert_effort_basis: >-
    (a) SEC EDGAR XBRL frame fetch methodology - reading data.sec.gov API docs,
    understanding the frame ccp='CY2026Q1' vs 'CY2026Q1I' duration/instant
    distinction, User-Agent + 10rps rate limit discipline, ASC 606 revenue tag
    union to handle post-2018 filers who dropped us-gaap:Revenues: ~6h.
    (b) Consolidated-vs-segment discipline - DQC_0150 no-dimension filter,
    handling of custom tag extensions, non-calendar fiscal year alignment via
    frame assembler vs companyfacts fallback: ~4h.
    (c) 4-sibling DuPont design - reading Nissim-Penman 2001 + Nissim 2023 +
    Amir/Kama/Livnat 2011 + Sloan 1996 for orthogonal signal set, understanding
    why raw OPM level rank is autocorrelated (persist trap) but Delta OPM is
    less persistent, deciding on TTM aggregates vs single-quarter, deciding on
    sector-residualization at SIC-2 vs FF12 vs GICS: ~10h.
    (d) Weight calibration - iterating W_GM/W_ATO/W_OCFM/W_REV against small
    labeled sample, understanding relative contribution: ~4h.
    (e) Sector taxonomy build - SIC-2 from submissions API per CIK: ~2h.
    (f) Point-in-time restatement discipline - earliest-filed per (period, tag)
    selection: ~3h.
    (g) Anti-fab surface (universe bijection + rank permutation) + submission
    CSV formatting: ~2h.
    (h) Assembly, validation, sanity checks: ~15h.
    (i) Contingencies + iteration on inevitable data-shape surprises: ~14h.
    Total: 60h.
  frontier_12h_defeat_evidence: >-
    Mechanism-prose per MEPHISTO.md:302 form-a, backed by measurement.
    Mechanism (b) iteration depth + (d) data heterogeneity narrative. Cite
    measured control ladder 2026-08-08: persist rho +0.248 total 14.012,
    random total 10.250, reference (4-sibling DuPont) total 27.942, oracle
    total 87.610. A 12h frontier solver would need to (i) fetch 14 XBRL frames
    with correct UA + throttle + gzip handling + duration vs instant
    distinction, (ii) implement no-dimension consolidated filter + ASC 606
    Revenue tag union, (iii) build SIC-2 sector-residualization per CIK,
    (iv) implement TTM asset averaging for ATO with 4 instant frames per CIK,
    (v) design 4-sibling weighted ensemble with defensible weights, (vi) handle
    ~46% missing GM + ~15% missing OCF gracefully via neutral midpoint fallback,
    (vii) resist the persist-of-boundary trap (rank by prior_year_opmargin_
    level_rank scores only 14.012 << 24 KILL bar). NOTE: authoring-time
    mechanism evidence. 12h live probe pending Phase 4 (see coverage_gap_
    frontier_probe_pending in contract).
  method_opacity_verified: true
  method_opacity_evidence: >-
    Three-step check per MEPHISTO.md:313. Tier-1 identifier tokens list:
    W_GM, W_ATO, W_OCFM, W_REV, 4-sibling-DuPont, DuPont-orthogonal-composite,
    prior_opmargin_reversion, revenue_growth_leverage_signal, sector-relative-
    delta-opmargin, cross_sibling_partial_correlation. Scan all agent-visible
    surfaces case-insensitively tolerant of hyphen/underscore/space
    substitution. RESULT: expect ZERO tier-1 hits (verified at Phase 1 closure
    by build_task.py output via assert_no_solver_identifiers_in_agent_surfaces).
    Bare public column names (cik, sic2, prior_year_opmargin_level_rank as
    boundary column string, raw column names gross_profit_cy2025q1 etc. in
    visible panel) appear on agent surface per MEPHISTO.md:321 (raw signal
    + evaluation surface permitted). Anti-fab surface is universe-bijection
    + rank-permutation, cannot serve as checksum for reference method.
  cost_structure_documented: true
  cost_structure: >-
    Lane weights L1 10 / L2 30 threshold-gated / L3 25 K=100 / L4 20 MAE-
    normalized / L5 15 partial-correlation-bonus. Bar constants K=100 (K/N
    floor ~3.6%), N_DECILES=10, L2_RHO_THRESHOLD=0.5, L5_CONTROL_COLUMN=
    prior_year_opmargin_level_rank. All bar constants agent-visible in
    p3gamma_lib.py; nothing about scorer hidden. Only hidden: realized
    Delta OpMargin ranks + pre-computed sibling rank vectors used as L5
    control + partial-correlation inputs.
  expected_submission_budget:
    max_submissions: 400
    submission_cooldown_sec: 120
    declared_in_instruction: true
    rationale: >-
      §15 requires universes <=50 items with K>=10% to cap max_submissions<=5.
      This universe is 2799 items with permutation deliverable and 5 aggregate
      lane scalars in redacted emission. No list-size dimension for agent to
      search per lane (L3 is fixed-K precision at K=100 = 3.6% of universe,
      L5 is mean of partial correlations across 4 fixed siblings). Rule places
      this in higher-budget class provided score.py fully opaque; anti-fab
      surface trivially satisfied by valid permutations, cannot be searched
      for per-item ground truth. Best-of-N gain bounded by calibration-search
      on 4 continuous weights against 5 aggregate scalars, expected <5 pts.
  pkw_families_invariants_satisfied:
    - "1. Two-container isolation (work + judge) via Harbor delivery format"
    - >-
      2. Hidden evaluation split (realized Delta OpMargin ranks + pre-computed
      sibling rank vectors judge-only; agent sees prior_year_opmargin_level_
      rank as visible boundary column + raw sibling data GP/OCF/Assets/Revenues/
      SIC-2 for own computation + regulatory sources URL index stub. Judge-side
      hidden_*.csv assertion-checked absent from agent surface at build time.)
    - >-
      3. No judge-only reference in grading path (Framework A: graded against
      realized reality). Reference solver ships in solution/ for calibration
      only; never the grading target. Reference method OPAQUE across every
      agent-visible surface per MEPHISTO.md:313 M5.
    - >-
      4. Multi-dimension partial credit (0-100 across 5 weighted metric-
      continuous lanes: L1 structural 10, L2 spearman_rank_threshold 30
      (rho > 0.5 curve), L3 top_k_worst 25, L4 decile_calibration_tightness 20,
      L5 cross_sibling_consistency 15 (partial correlation bonus, empirical
      ceiling ~3/15). L4 MAE-normalized non-invertible per §15. L3 precision-
      at-K aggregate over K-item set, aggregate-scalar-only in redacted
      emission. L5 partial correlation controlling for prior_year_opmargin_
      level_rank collapses persist-of-boundary shortcuts to 0 by construction.
    - >-
      5. Anti-gaming: universe-bijection + rank-permutation enforcement at L1
      (structural cascade to 0 on violation); deliverable is self-checking
      permutation; score.py emits ONLY 5 aggregate lane scalars + structural
      feedback + submitted distributional shape (mean, stddev, min, max). No
      per-item hit, no ground-truth cik, no realized value, no per-sibling
      partial in redacted emission.
    - >-
      6. Rubric hidden from agent -- PARTIAL BY DESIGN: score.py and realized
      Delta OpMargin data live only in judge image, but p3gamma_lib.py (every
      lane constant, K constant, formula) deliberately agent-visible byte-
      identical to judge copy, following treasury/EIA pattern-carrier. Task
      is financial forecasting skill, not scorer-guessing.
    - >-
      7. Structured machine-parseable output (score.py emits STRUCTURED_RESULT_
      JSON on stderr + TOTAL_SCORE on stdout; test.sh normalizes to
      /logs/verifier/reward.txt in [0,1])

