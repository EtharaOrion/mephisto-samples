[task]
name = "edgebench/cryoem_single_particle_reconstruction"
description = "CryoEM single-particle 3D density reconstruction from 2D noisy micrographs at unknown random orientations. Bayesian inverse problem in structural biology. Agent must recover: (1) 3D density map at CPU-feasible resolution (10-15A ceiling), (2) per-particle poses (rotation + translation), (3) declared handedness and symmetry. Scored on 8 lanes, 0-100."
keywords = [
  "scientific-problems-ml",
  "cryo-em",
  "structural-biology",
  "bayesian-inverse-problem",
  "3d-reconstruction",
]

[[task.authors]]
name = "Mephisto"

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.cryoem_single_particle_reconstruction:v1@sha256:a52bc80a514ca5bb265be00e6caf6142a8538c9880b1ab260ddd8e2297c33049"
network_mode = "no-network"
workdir = "/home/workspace/cryoem_reconstruction"

