artifacts = [
  { source = "/home/workspace/auction_bidding.py" },
  { source = "/home/workspace/requirements.txt" },
  { source = "/home/workspace/bidding_results.json" },
]

[task]
name = "edgebench/treasury_auction_bidding_calibration"
description = "Treasury primary-market auction bid ladder calibration across the note/bond product mix. Agent produces per-auction bid ladders + predicted clearing metrics (bidToCover, tail, indirect/direct share, allocation share, pre-auction reference-yield dislocation). Scored across held-out 2025 auction cycle with cross-product-mix stability lane and rate-regime-shift bonus."
keywords = [
  "professional-knowledge-work",
  "finance",
  "treasury-auction-bidding",
  "primary-market-microstructure",
  "macro-regime-adaptive",
]

[[task.authors]]
name = "Mephisto"

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.treasury_auction_bidding_calibration:e484ebf545a9"
network_mode = "no-network"
workdir = "/home/workspace"

[verifier]
timeout_sec = 3600
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.treasury_auction_bidding_calibration:29bbbfe34182"
network_mode = "no-network"
workdir = "/home/workspace"

[extensions.sforge]
task_id = "treasury_auction_bidding_calibration"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["auction_bidding.py", "requirements.txt", "bidding_results.json"]
submit_exclude = [".git", "__pycache__", "*.pyc", "node_modules", "bin", "obj"]
work_image_tag = "e484ebf545a9"
judge_image_tag = "29bbbfe34182"

[metadata]
source_host = "US Treasury Auction Results (treasurydirect.gov TA_WS/securities/{Bill|Note|Bond}) + FRED clean-series (fred.stlouisfed.org)"
data_license = "US Government work, public domain (no copyright)"
license_class = "us-gov-public-domain"
license_source = "US Treasury Department + Federal Reserve Bank of St. Louis"
