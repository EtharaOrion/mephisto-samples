schema_version = "1.4"

[task]
name = "edgebench/txmeal_participation_shortfall_watchlist"
description = "TX School-Meal Participation-Shortfall Watchlist"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "txmeal",
    "participation",
    "shortfall",
    "watchlist",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.txmeal_participation_shortfall_watchlist:96b85bf896db"
network_mode = "no-network"
workdir = "/home/workspace/txmeal_watch"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.txmeal_participation_shortfall_watchlist:96b85bf896db"
network_mode = "no-network"
workdir = "/home/workspace/txmeal_watch"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "txmeal_participation_shortfall_watchlist"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "txmeal_watch_lib.py",
    "gate.py",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "96b85bf896db"
judge_image_tag = "96b85bf896db"

[metadata]
provenance_schema_version = "1"
source_host = "Texas Dept of Agriculture, National School Lunch Program (data.texas.gov)"
data_license = "data.texas.gov Socrata licenseId=PUBLIC_DOMAIN (TDA NSLP claim actuals)"
license_class = "tx-open-data-public-domain"
license_confidence = "high"
provenance_flags = []
provenance_source = "seed/build_bundle_txmeal_watch.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-19"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
