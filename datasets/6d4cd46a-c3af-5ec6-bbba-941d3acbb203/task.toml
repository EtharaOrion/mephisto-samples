schema_version = "1.4"

[task]
name = "edgebench/oss_dependency_abandonment_watchlist"
description = "OSS Dependency-Abandonment Breach-Triage Watchlist"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "oss",
    "dependency",
    "abandonment",
    "watchlist",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.oss_dependency_abandonment_watchlist:c9d7304fe1d0"
network_mode = "no-network"
workdir = "/home/workspace/oss_abandon"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.oss_dependency_abandonment_watchlist:c9d7304fe1d0"
network_mode = "no-network"
workdir = "/home/workspace/oss_abandon"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "oss_dependency_abandonment_watchlist"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "abandon_lib.py",
    "gate.py",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "c9d7304fe1d0"
judge_image_tag = "c9d7304fe1d0"

[metadata]
provenance_schema_version = "1"
source_host = "PyPI release history (Google Cloud public dataset; identical facts via unauthenticated JSON API)"
data_license = "Google Cloud public dataset 'licensed under the Creative Commons License'"
license_class = "creative-commons"
license_confidence = "high"
provenance_flags = []
provenance_source = "seed/build_bundle_oss_dependency_abandonment_watchlist.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-20"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
