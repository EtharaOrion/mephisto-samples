schema_version = "1.4"

[task]
name = "edgebench/montgomery_food_safety_book"
description = "Food-Safety Inspection-Targeting Book (Montgomery County)"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "montgomery",
    "food",
    "safety",
    "book",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.montgomery_food_safety_book:d689f1bf1a61"
network_mode = "no-network"
workdir = "/home/workspace/food_safety_book"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.montgomery_food_safety_book:d689f1bf1a61"
network_mode = "no-network"
workdir = "/home/workspace/food_safety_book"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "montgomery_food_safety_book"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "montgomery_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "d689f1bf1a61"
judge_image_tag = "d689f1bf1a61"

[metadata]
provenance_schema_version = "1"
source_host = "Montgomery County MD food-service inspections (Socrata open data)"
data_license = "Montgomery County open data (Socrata), redistributable; NOT formally stamped public domain."
license_class = "muni-open-data-redistributable"
license_confidence = "high"
provenance_flags = ["redistributable-not-public-domain"]
provenance_source = "seed/build_bundle_montgomery_food_safety_book.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-20"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
