schema_version = "1.4"

[task]
name = "edgebench/pell_disbursement_shortfall_watchlist"
description = "Pell Disbursement-Shortfall Watchlist"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "pell",
    "disbursement",
    "shortfall",
    "watchlist",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.pell_disbursement_shortfall_watchlist:6111c197a1fc"
network_mode = "no-network"
workdir = "/home/workspace/pell_watch"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.pell_disbursement_shortfall_watchlist:6111c197a1fc"
network_mode = "no-network"
workdir = "/home/workspace/pell_watch"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "pell_disbursement_shortfall_watchlist"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "pell_watch_lib.py",
    "gate.py",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "6111c197a1fc"
judge_image_tag = "6111c197a1fc"

[metadata]
provenance_schema_version = "1"
source_host = "Federal Student Aid 'Federal Pell Grant Volume by School' (FSA Data Center)"
data_license = "US Government work, public domain (17 USC 105)"
license_class = "us-gov-public-domain"
license_confidence = "high"
provenance_flags = []
provenance_source = "seed/build_bundle_pell_watch.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-19"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
