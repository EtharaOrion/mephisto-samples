schema_version = "1.4"

[task]
name = "edgebench/tx_mixedbev_tax_book"
description = "TX Mixed-Beverage Receipt-Growth Book"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "mixedbev",
    "tax",
    "book",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.tx_mixedbev_tax_book:64f5c29aadee"
network_mode = "no-network"
workdir = "/home/workspace/receipts"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.tx_mixedbev_tax_book:64f5c29aadee"
network_mode = "no-network"
workdir = "/home/workspace/receipts"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "tx_mixedbev_tax_book"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "tx_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "64f5c29aadee"
judge_image_tag = "64f5c29aadee"

[metadata]
provenance_schema_version = "1"
source_host = "Texas Comptroller Mixed-Beverage Sales Receipts (data.texas.gov g5bj-yb6k)"
data_license = "Socrata view metadata licenseId=PUBLIC_DOMAIN"
license_class = "tx-open-data-public-domain"
license_confidence = "high"
provenance_flags = []
provenance_source = "seed/build_bundle_tx_mixedbev_tax_book.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-19"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
