schema_version = "1.4"

[task]
name = "edgebench/cms_nursing_home_deficiency_watchlist"
description = "CMS Nursing-Home Deficiency-Surge Watchlist (severity-weighted crossing over the CMS provider-data Health Deficiencies feed, Nov-2025..Apr-2026 grade window)"
authors = ["Ethara.AI Mephisto"]
keywords = [
    "professional-knowledge-work",
    "long-term-care",
    "nursing-home",
    "deficiency",
    "surveillance",
    "watchlist",
    "cms",
    "provider-data",
    "severity-weighted",
    "crossing",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.cms_nursing_home_deficiency_watchlist:7a442494fe69"
network_mode = "no-network"
workdir = "/home/workspace/cms_nursing_home_watch"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.cms_nursing_home_deficiency_watchlist:7a442494fe69"
network_mode = "no-network"
workdir = "/home/workspace/cms_nursing_home_watch"

[extensions.sforge]
task_id = "cms_nursing_home_deficiency_watchlist"
base_image = "python310"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "REPORT.md",
    "TRUTH.md",
    "cms_nursing_home_deficiency_watchlist_scorer.py",
    "reference.py",
    "calibrate.py",
    "build_panel.py",
    "judge_constants.yaml",
    "rubric.yaml",
    "tests/",
    "gate.py",
    "constraints.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "7a442494fe69"
judge_image_tag = "7a442494fe69"

[metadata]
provenance_schema_version = "1"
source_host = "CMS provider-data Health Deficiencies feed, Socrata distribution r5ix-sfxw (data.cms.gov)"
data_license = "Public, US Gov works"
license_class = "us-gov"
license_confidence = "high"
provenance_flags = ["hold:pilot_required"]
provenance_source = "seed/build/cms_nursing_home_deficiency_watchlist/{contract.yaml, REPORT.md, HANDOFF-TO-SNEHIL.md}; author-pass 2026-07-26"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-26"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
