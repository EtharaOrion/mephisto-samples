authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "pell",
    "grant",
    "disbursement",
    "growth",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.pell_grant_disbursement_growth:cd2e0f29f514"
network_mode = "no-network"
workdir = "/home/workspace/pell"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.pell_grant_disbursement_growth:30ad293f1f18"
network_mode = "no-network"
workdir = "/home/workspace/pell"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "pell_grant_disbursement_growth"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "pell_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "cd2e0f29f514"
judge_image_tag = "30ad293f1f18"

[metadata]
provenance_schema_version = "1"
source_host = "Federal Student Aid 'Federal Pell Grant Volume by School' (FSA Data Center)"
