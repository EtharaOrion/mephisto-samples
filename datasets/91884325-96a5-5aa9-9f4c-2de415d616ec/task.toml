schema_version = "1.4"

[task]
name = "edgebench/cms_ma_retention_provisioning"
description = "Medicare Advantage Member-Retention Provisioning"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "cms",
    "retention",
    "provisioning",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.cms_ma_retention_provisioning:a0f14ed3bacf"
network_mode = "no-network"
workdir = "/home/workspace/retention"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.cms_ma_retention_provisioning:a0f14ed3bacf"
network_mode = "no-network"
workdir = "/home/workspace/retention"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "cms_ma_retention_provisioning"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "cms_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "a0f14ed3bacf"
judge_image_tag = "a0f14ed3bacf"

[metadata]
provenance_schema_version = "1"
source_host = "CMS 'Monthly Enrollment by Contract' (cms.gov)"
data_license = "US Government work, public domain (17 USC 105)"
license_class = "us-gov-public-domain"
license_confidence = "high"
provenance_flags = []
provenance_source = "seed/build_bundle_cms_ma_enrollment.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-18"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
