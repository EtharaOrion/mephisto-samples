schema_version = "1.4"

[task]
name = "edgebench/nport_liquidity_watchlist"
description = "Fund-Liquidity Breach-Triage Watchlist"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "nport",
    "liquidity",
    "watchlist",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.nport_liquidity_watchlist:9a1de5b6c581"
network_mode = "no-network"
workdir = "/home/workspace/nport_watch"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.nport_liquidity_watchlist:9a1de5b6c581"
network_mode = "no-network"
workdir = "/home/workspace/nport_watch"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "nport_liquidity_watchlist"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "watch_lib.py",
    "gate.py",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "9a1de5b6c581"
judge_image_tag = "9a1de5b6c581"

[metadata]
provenance_schema_version = "1"
source_host = "SEC N-PORT monthly fund flows (sec.gov)"
data_license = "US Government work, public domain (17 USC 105)"
license_class = "us-gov-public-domain"
license_confidence = "high"
provenance_flags = []
provenance_source = "seed/build_bundle_nport_liquidity_watchlist.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-18"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
