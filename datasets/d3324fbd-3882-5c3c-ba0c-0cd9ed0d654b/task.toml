schema_version = "1.4"

[task]
name = "edgebench/dl_disbursement_growth"
description = "Direct-Loan Disbursement-Growth Provisioning"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "disbursement",
    "growth",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.dl_disbursement_growth:75ce9e23e0c2"
network_mode = "no-network"
workdir = "/home/workspace/dl_disbursement"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.dl_disbursement_growth:f9d7df9c9792"
network_mode = "no-network"
workdir = "/home/workspace/dl_disbursement"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "dl_disbursement_growth"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "dl_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "75ce9e23e0c2"
judge_image_tag = "f9d7df9c9792"

[metadata]
provenance_schema_version = "1"
source_host = "Federal Student Aid 'Federal Direct Loan Volume by School' (FSA Data Center)"
data_license = "US Government work, public domain (17 USC 105)"
license_class = "us-gov-public-domain"
license_confidence = "high"
provenance_flags = ["hold:grader-redesign", "hold:persist-ge-25"]
