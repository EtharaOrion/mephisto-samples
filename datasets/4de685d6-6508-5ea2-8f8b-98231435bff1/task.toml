schema_version = "1.4"

[task]
name = "edgebench/sec_leverage_expansion_book"
description = "Balance-Sheet Leverage-Expansion Surveillance Book"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "sec",
    "leverage",
    "expansion",
    "book",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.sec_leverage_expansion_book:9314812fabad"
network_mode = "no-network"
workdir = "/home/workspace/leverage_book"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.sec_leverage_expansion_book:3f2106312b48"
network_mode = "no-network"
workdir = "/home/workspace/leverage_book"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "sec_leverage_expansion_book"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "sec_leverage_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "9314812fabad"
judge_image_tag = "3f2106312b48"

[metadata]
provenance_schema_version = "1"
source_host = "SEC EDGAR XBRL frames (us-gaap Liabilities / Assets; sec.gov)"
data_license = "US Government work, public domain (17 USC 105)"
license_class = "us-gov-public-domain"
license_confidence = "high"
provenance_flags = ["hold:grader-redesign", "hold:persist-ge-25"]
provenance_source = "seed/build_bundle_sec_leverage_expansion_book.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-18"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
