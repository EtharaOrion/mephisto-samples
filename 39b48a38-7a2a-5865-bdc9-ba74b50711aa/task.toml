schema_version = "1.4"

artifacts = [
  { source = "/home/workspace/submission" },
]

[task]
name = "mephisto/chronopack_undocumented_encoder"
description = "Recover the selection policy, field normalisations and trailer algorithm of a columnar block encoder that is documented nowhere, from a recorded corpus that samples its behaviour rather than specifying it, and reproduce its bytes exactly on columns drawn from a wider distribution."
keywords = [
  "systems-software-engineering",
  "bit-exact",
  "undocumented-behaviour-recovery",
  "policy-inference",
  "binary-format",
  "compression",
]

[[task.authors]]
name = "Mephisto"

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.chronopack_undocumented_encoder:69f65820842c@sha256:d7d3c51237f37e2889108ad43413228c2d03e06a4d24554bfcedcf7fac34120b"
network_mode = "no-network"
workdir = "/home/workspace"

