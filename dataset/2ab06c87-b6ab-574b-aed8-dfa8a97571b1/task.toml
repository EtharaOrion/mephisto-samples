schema_version = "1.4"

[task]
name = "edgebench/cfpb_surge_watchlist"
description = "Consumer-Complaint Surge Breach-Triage Watchlist"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "cfpb",
    "surge",
    "watchlist",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.cfpb_surge_watchlist:PENDING-REBUILD-recal-m1-source"
network_mode = "no-network"
workdir = "/home/workspace/cfpb_watch"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.cfpb_surge_watchlist:PENDING-REBUILD-recal-m1-source"
network_mode = "no-network"
workdir = "/home/workspace/cfpb_watch"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "cfpb_surge_watchlist"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "watch_lib.py",
    "gate.py",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "PENDING-REBUILD-recal-m1-source"
judge_image_tag = "PENDING-REBUILD-recal-m1-source"

[metadata]
provenance_schema_version = "1"
source_host = "CFPB Consumer Complaint Database (consumerfinance.gov)"
data_license = "Public, CC0"
license_class = "cc0"
license_confidence = "high"
provenance_flags = ["hold:grader-redesign", "hold:persist-ge-25"]
provenance_source = "seed/build_bundle_cfpb_surge_watchlist.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-18"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
