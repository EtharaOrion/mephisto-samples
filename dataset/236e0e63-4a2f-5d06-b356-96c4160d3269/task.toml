schema_version = "1.4"

[task]
name = "edgebench/fafsa_completion_provisioning"
description = "FAFSA Completion-Intervention Provisioning"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "fafsa",
    "completion",
    "provisioning",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.fafsa_completion_provisioning:716a7e06a978"
network_mode = "no-network"
workdir = "/home/workspace/fafsa"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.fafsa_completion_provisioning:6d4be8d9517d"
network_mode = "no-network"
workdir = "/home/workspace/fafsa"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "fafsa_completion_provisioning"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "fafsa_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "716a7e06a978"
judge_image_tag = "6d4be8d9517d"

[metadata]
provenance_schema_version = "1"
source_host = "Federal Student Aid 'FAFSA Application Volume by School' (FSA Data Center)"
data_license = "US Government work, public domain (17 USC 105)"
license_class = "us-gov-public-domain"
license_confidence = "high"
provenance_flags = ["hold:grader-redesign", "hold:persist-ge-25"]
provenance_source = "seed/build_bundle_fafsa.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-18"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
