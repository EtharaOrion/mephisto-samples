schema_version = "1.4"

# Harbor task.toml scaffold for sec_share_dilution_watchlist.
# TOMBSTONES (Snehil fills at image bake):
#   - docker_image work  -> PENDING-IMAGE-BUILD-work  (retag to ECR mephisto/edgebench.work.sec_share_dilution_watchlist:<tag>)
#   - docker_image judge -> PENDING-IMAGE-BUILD-judge (retag to ECR mephisto/edgebench.judge.sec_share_dilution_watchlist:<tag>)
#   - work_image_tag / judge_image_tag -> the short digest Snehil bakes
# After Snehil assigns UUID, this file lands at dataset/<uuid>/task.toml.

[task]
name = "edgebench/sec_share_dilution_watchlist"
description = "SEC Share-Dilution Surge Watchlist (US filer CY2025Q4->CY2026Q1 shares-outstanding surge, bucket-normalized to within-|boundary-rate|-decile surprise rank)"
authors = ["Ethara.AI Mephisto"]
keywords = [
    "professional-knowledge-work",
    "equity-research",
    "share-issuance",
    "dilution",
    "surveillance-watchlist",
    "sec-edgar",
    "xbrl",
    "shares-outstanding",
    "allocation-book",
    "bucket-normalization",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.sec_share_dilution_watchlist:17fb3f273bd0"
network_mode = "no-network"
workdir = "/home/workspace/sec_share_dilution_watchlist"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.sec_share_dilution_watchlist:17fb3f273bd0"
network_mode = "no-network"
workdir = "/home/workspace/sec_share_dilution_watchlist"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "sec_share_dilution_watchlist"
base_image = "python310"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "gate.py",
    "README.md",
    "REPORT.md",
    "TRUTH.md",
    "HANDOFF-TO-SNEHIL.md",
    "sec_share_dilution_watchlist_scorer.py",
    "calibrate.py",
    "strong_solver.py",
    "shares_data.py",
    "emit_tables.py",
    "fetch_frames.py",
    "strong_scores.json",
    "calibration_results.json",
    "judge_constants.yaml",
    "constraints.json",
    "frames/",
    "rubric.yaml",
    "tests/",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "17fb3f273bd0"
judge_image_tag = "17fb3f273bd0"

[metadata]
provenance_schema_version = "1"
source_host = "SEC EDGAR XBRL frames API - data.sec.gov; us-gaap:CommonStockSharesOutstanding (units shares)"
data_license = "Public, US Gov works (17 USC 105)"
license_class = "us-gov"
license_confidence = "high"
provenance_flags = ["hold:pilot_required"]
provenance_source = "seed/build/sec_share_dilution_watchlist/HANDOFF-TO-SNEHIL.md; author-pass 2026-07-26; DERIVED from sec_earnings_surprise_book bucket-normalization pattern (within-boundary-decile surprise rank of realized delta, not raw delta)"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-26"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
