schema_version = "1.4"

[task]
name = "edgebench/cms_hospice_provider_watchlist"
description = "CMS Hospice Provider Quality-Decline Watchlist (>=3 pct relative decline in the H_008 composite process measure over the CMS provider-data hospice-care feed, Nov-2025 -> May-2026 snapshot pair; asymmetric features: agent clinical-only, strong solver sees state + ownership)"
authors = ["Ethara.AI Mephisto"]
keywords = [
    "professional-knowledge-work",
    "hospice",
    "quality-measure",
    "clinical-decline",
    "surveillance",
    "watchlist",
    "cms",
    "provider-data",
    "relative-decline",
    "asymmetric-features",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.cms_hospice_provider_watchlist:eb81c68359e8"
network_mode = "no-network"
workdir = "/home/workspace/cms_hospice_watch"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.cms_hospice_provider_watchlist:eb81c68359e8"
network_mode = "no-network"
workdir = "/home/workspace/cms_hospice_watch"

[extensions.sforge]
task_id = "cms_hospice_provider_watchlist"
base_image = "python310"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "REPORT.md",
    "TRUTH.md",
    "cms_hospice_provider_watchlist_scorer.py",
    "reference.py",
    "calibrate.py",
    "build_panel.py",
    "judge_constants.yaml",
    "rubric.yaml",
    "tests/",
    "gate.py",
    "constraints.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "eb81c68359e8"
judge_image_tag = "eb81c68359e8"

[metadata]
provenance_schema_version = "1"
source_host = "CMS provider-data hospice-care feed, Socrata distribution r5ix-sfxw-family (data.cms.gov)"
data_license = "CC0 public-domain, CMS provider-data"
license_class = "us-gov"
license_confidence = "high"
provenance_flags = ["hold:pilot_required"]
provenance_source = "seed/build/cms_hospice_provider_watchlist/{contract.yaml, REPORT.md, HANDOFF-TO-SNEHIL.md}; author-pass 2026-07-26"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-26"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
