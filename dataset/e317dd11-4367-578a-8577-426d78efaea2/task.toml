schema_version = "1.4"

[task]
name = "edgebench/chicago_taxi_revenue_book"
description = "Chicago Taxi Receipt-Growth Book"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "chicago",
    "taxi",
    "revenue",
    "book",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.chicago_taxi_revenue_book:a99b16b77056"
network_mode = "no-network"
workdir = "/home/workspace/taxibook"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.chicago_taxi_revenue_book:a99b16b77056"
network_mode = "no-network"
workdir = "/home/workspace/taxibook"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "chicago_taxi_revenue_book"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "taxi_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "a99b16b77056"
judge_image_tag = "a99b16b77056"

[metadata]
provenance_schema_version = "1"
source_host = "City of Chicago 'Taxi Trips (2024-)' (Socrata ajtu-isnz)"
data_license = "Chicago Open Data Portal Terms of Use (attribution 'City of Chicago', 'See Terms of Use'); redistributable on the same basis as chicago_building_code_book; NOT a licence-restricted feed and NOT formally stamped public domain."
license_class = "muni-open-data-redistributable"
license_confidence = "high"
provenance_flags = ["redistributable-not-public-domain"]
provenance_source = "seed/build_bundle_chicago_taxi.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-19"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
