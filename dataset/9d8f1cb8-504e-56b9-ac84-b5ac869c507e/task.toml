schema_version = "1.4"

[task]
name = "edgebench/chicago_building_code_book"
description = "Chicago Building-Code Enforcement Targeting"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "chicago",
    "building",
    "code",
    "book",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.chicago_building_code_book:e00e01951ca2"
network_mode = "no-network"
workdir = "/home/workspace/enforcement"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.chicago_building_code_book:e00e01951ca2"
network_mode = "no-network"
workdir = "/home/workspace/enforcement"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "chicago_building_code_book"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "building_scorer.py",
    "gate.py",
    "constraints.json",
    "anchors_public.json",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "e00e01951ca2"
judge_image_tag = "e00e01951ca2"

[metadata]
provenance_schema_version = "1"
source_host = "Chicago Data Portal Building Violations (Socrata 22u3-xenr)"
data_license = "City of Chicago Data Portal Terms of Use: open municipal data for public display, distribution and use (harvested to catalog.data.gov); redistributable, NOT formally stamped public domain (City reserves a right to require termination of use)."
license_class = "muni-open-data-redistributable"
license_confidence = "high"
provenance_flags = ["redistributable-not-public-domain"]
provenance_source = "seed/build_bundle_chicago_building_code_book.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-18"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
