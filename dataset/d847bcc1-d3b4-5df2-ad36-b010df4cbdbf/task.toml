schema_version = "1.4"

[task]
name = "edgebench/nyc_restaurant_closure_risk_watchlist"
description = "NYC Restaurant Closure-Risk Breach-Triage Watchlist"
authors = ["EdgeBench"]
keywords = [
    "professional-knowledge-work",
    "nyc",
    "restaurant",
    "closure",
    "risk",
    "watchlist",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.nyc_restaurant_closure_risk_watchlist:b072d2dabaec"
network_mode = "no-network"
workdir = "/home/workspace/nyc_rest_watch"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.nyc_restaurant_closure_risk_watchlist:b072d2dabaec"
network_mode = "no-network"
workdir = "/home/workspace/nyc_rest_watch"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "nyc_restaurant_closure_risk_watchlist"
base_image = "python"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "README.md",
    "watch_lib.py",
    "gate.py",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "b072d2dabaec"
judge_image_tag = "b072d2dabaec"

[metadata]
provenance_schema_version = "1"
source_host = "NYC OpenData DOHMH Restaurant Inspection Results (Socrata 43nn-pn8j)"
data_license = "NYC OpenData, cited public domain"
license_class = "muni-open-data-public-domain"
license_confidence = "high"
provenance_flags = []
provenance_source = "seed/build_bundle_nyc_restaurant_closure_risk_watchlist.py docstring; authored date: memory/ledger.yaml inventory"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-19"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
