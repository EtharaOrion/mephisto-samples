schema_version = "1.4"

# Harbor task.toml scaffold for sec_equity_erosion_watchlist.
# TOMBSTONES (Snehil fills at image bake):
#   - docker_image work  -> PENDING-IMAGE-BUILD-work  (retag to ECR mephisto/edgebench.work.sec_equity_erosion_watchlist:<tag>)
#   - docker_image judge -> PENDING-IMAGE-BUILD-judge (retag to ECR mephisto/edgebench.judge.sec_equity_erosion_watchlist:<tag>)
#   - work_image_tag / judge_image_tag -> the short digest Snehil bakes
# After Snehil assigns UUID, this file lands at dataset/<uuid>/task.toml.

[task]
name = "edgebench/sec_equity_erosion_watchlist"
description = "SEC Equity-Erosion Surge Watchlist (US filer CY2025Q4->CY2026Q1 stockholders-equity delta erosion, compound-bucket-normalized to within-(|boundary-rate|-decile x always_negative-flag) erosion rank)"
authors = ["Ethara.AI Mephisto"]
keywords = [
    "professional-knowledge-work",
    "equity-research",
    "capital-erosion",
    "stockholders-equity",
    "surveillance-watchlist",
    "sec-edgar",
    "xbrl",
    "allocation-book",
    "compound-bucket-normalization",
    "ratchet-flag",
]

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.sec_equity_erosion_watchlist:f7ab9d7badc3"
network_mode = "no-network"
workdir = "/home/workspace/sec_equity_erosion_watchlist"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.sec_equity_erosion_watchlist:f7ab9d7badc3"
network_mode = "no-network"
workdir = "/home/workspace/sec_equity_erosion_watchlist"

# Fields Harbor's task.toml cannot express; consumed by harness/sforge/harness/harbor_loader.py.
[extensions.sforge]
task_id = "sec_equity_erosion_watchlist"
base_image = "python310"
platform = "linux/amd64,linux/arm64"
parser = "structured_json"
selection = "score_first"
score_direction = "maximize"
submit_paths = ["strategy/"]
submit_exclude = [
    "data/",
    "check.py",
    "gate.py",
    "README.md",
    "REPORT.md",
    "TRUTH.md",
    "HANDOFF-TO-SNEHIL.md",
    "sec_equity_erosion_watchlist_scorer.py",
    "calibrate.py",
    "strong_solver.py",
    "equity_data.py",
    "emit_tables.py",
    "strong_scores.json",
    "calibration_results.json",
    "judge_constants.yaml",
    "constraints.json",
    "frames/",
    "rubric.yaml",
    "tests/",
    "__pycache__/",
    "*.pyc",
]
work_image_tag = "f7ab9d7badc3"
judge_image_tag = "f7ab9d7badc3"

[metadata]
provenance_schema_version = "1"
source_host = "SEC EDGAR XBRL frames API - data.sec.gov; us-gaap:StockholdersEquity (units USD)"
data_license = "Public, US Gov works (17 USC 105)"
license_class = "us-gov"
license_confidence = "high"
provenance_flags = ["hold:pilot_required"]
provenance_source = "seed/build/sec_equity_erosion_watchlist/HANDOFF-TO-SNEHIL.md; author-pass 2026-07-26; DERIVED from sec_share_dilution_watchlist within-bucket-RANK pattern, extended with COMPOUND bucket key (|boundary_rate|-decile x always_negative flag) to defuse the one-way-ratchet property of equity destruction"

[metadata.upstream_provenance]
origin = "original"
provenance_date = "2026-07-26"
asserts_no_upstream_lift = true
upstream_identity = ""
upstream_license = ""
modifications = ""
