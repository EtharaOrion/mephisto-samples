schema_version = "1.4"

artifacts = [
  { source = "/home/workspace/cpi_nowcast_book.py" },
  { source = "/home/workspace/requirements.txt" },
  { source = "/home/workspace/nowcast_results.json" },
]

[task]
name = "edgebench/cpi_nowcast_positioning_book"
description = "US macroeconomic monthly inflation-print prediction + Treasury rates positioning book. Agent produces per-month per-series forward nowcasts for headline CPI (CPIAUCSL), core CPI (CPILFESL), headline PCE (PCEPI), core PCE (PCEPILFE) plus a Treasury duration + breakeven-inflation positioning book for the 1-week window post-print, plus a Fed policy regime label. Scored on realized 2025 monthly BLS/BEA releases plus 1-week post-print market response across 12 months x 4 series = 48 hidden prints, with a cross-series stability lane and a Fed-pivot-detection bonus."
keywords = [
  "professional-knowledge-work",
  "finance",
  "macro-inflation-nowcast",
  "rates-positioning-book",
  "fed-regime-adaptive",
]

[[task.authors]]
name = "Mephisto"

[agent]
timeout_sec = 43200

[environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.work.cpi_nowcast_positioning_book:cb487cbd68ee@sha256:cb487cbd68ee7136f3e77d2a91440ceaea2697f6d3609dccd92b7dbcd514952f"
network_mode = "no-network"
workdir = "/home/workspace"

[verifier]
timeout_sec = 3600
environment_mode = "separate"

[verifier.environment]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/mephisto/edgebench.judge.cpi_nowcast_positioning_book:1b5c0da32fcd@sha256:1b5c0da32fcd14a97067cc09802a3f3d7b0208c17d3057957f35ce54bc22768b"
network_mode = "no-network"
workdir = "/home/workspace"

[extensions.sforge]
